[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jit-context"
version = "0.3.0"
description = "JIT-JEV Context OS: Epistemic Context Runtime & System 1 Gate for AI Agents"
readme = "README.md"
authors = [{ name = "Wojciech Wiesner", email = "wojciech@theones.io" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "requests>=2.32.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
# Only imported by benchmarks/ (not part of the installed hook/CLI runtime,
# excluded from [tool.setuptools.packages.find]). Not required for `jit install`.
benchmarks = [
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "tabulate>=0.9.0",
    "youtube-transcript-api>=1.2.4",
]

[project.urls]
Homepage = "https://doi.org/10.5281/zenodo.22649542"
Repository = "https://github.com/wojciechwiesner/jit-context"

[project.scripts]
jit = "init:main"
jit-doctor = "health.doctor:main"
jit-observatory = "health.server:main"
jit-livestream = "health.livestream:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["broker_client", "config", "hooks", "init", "mcp_server", "session_overlay"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["cognitive*", "context*", "health*", "installer*", "l0*", "l1*", "l2*", "telemetry*"]

[tool.setuptools.package-data]
health = ["*.html"]

[tool.setuptools.data-files]
"share/jit-context" = ["src/plugin.yaml"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
