[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jit-context"
version = "0.2.11"
description = "JIT-JEV Context OS: Epistemic Context Runtime & System 1 Gate for AI Agents"
readme = "README.md"
authors = [{ name = "Wojciech Wiesner", email = "wojciech@theones.io" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "requests>=2.32.5",
    "tabulate>=0.9.0",
    "youtube-transcript-api>=1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://doi.org/10.5281/zenodo.22649542"
Repository = "https://github.com/wojciechwiesner/jit-context"

[project.scripts]
jit-doctor = "health.doctor:main"
jit-observatory = "telemetry.observatory:main"

[tool.pytest.ini_options]
testpaths = ["src/tests"]
