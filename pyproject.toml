[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jit-context"
version = "0.1.3"
description = "An Epistemic Context Runtime & JIT OS for AI Agents"
readme = "README.md"
authors = [{ name = "Wojciech Wiesner", email = "wojciech@theones.io" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://doi.org/10.5281/zenodo.22649542"
Repository = "https://github.com/wojciechwiesner/jit-context"

[project.scripts]
jit-doctor = "health.doctor:main"
jit-observatory = "telemetry.observatory:main"
