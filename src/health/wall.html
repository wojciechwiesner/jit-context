<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operator Wall - JIT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='3' width='18' height='18' rx='3' fill='none' stroke='%230071E3' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/wall.css">
<script src="/static/wall_theme.js"></script>
</head>
<body>
<main class="wall" id="wall">
  <div class="topbar" role="banner"><span class="brand">Operator Wall</span><span class="sp"></span>
    <div class="seg" role="radiogroup" aria-label="Motyw"><button type="button" role="radio" data-theme-pick="light" aria-checked="true">Jasny</button><button type="button" role="radio" data-theme-pick="dark" aria-checked="false">Ciemny</button></div>
    <div class="v-refresh" title="Odświeżanie co 60 s"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span id="v-tick">60 s</span></div>
  </div>
  <header class="verdict" id="verdict" aria-live="polite">
    <div class="v-text"><h1 id="v-sentence">Ładowanie...</h1><p id="v-age" class="v-age"></p></div>
    <div id="v-now" class="v-now" hidden><span class="lbl">Teraz:</span><span class="txt" id="v-now-text"></span><a class="btn primary pill" id="v-now-link" href="#">Otwórz</a></div>
  </header>
  <section class="col needs" aria-labelledby="h-needs"><h2 id="h-needs">Wymaga mnie</h2><ul id="needs" class="group"></ul></section>
  <section class="col projects" aria-labelledby="h-proj"><h2 id="h-proj">Projekty <small id="proj-count"></small></h2><div id="projects"></div></section>
  <section class="col machines" aria-labelledby="h-mach"><h2 id="h-mach">Maszyny i agenci</h2><ul id="machines" class="group"></ul><div id="sources" class="sources"></div></section>
  <footer class="charters card" id="charters-bar">
    <span id="charters-text">Chartery: ...</span>
    <button type="button" id="charters-open" class="btn primary">Przejrzyj do zatwierdzenia</button>
  </footer>
</main>
<div id="overlay" class="overlay" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="ov-title">
    <div class="panel-bar"><h2 id="ov-title">Chartery do zatwierdzenia</h2><span class="sp"></span>
      <button type="button" id="ov-bulk" class="btn primary">Zatwierdź zaznaczone</button>
      <button type="button" id="ov-close" class="btn" aria-label="Zamknij"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg></button></div>
    <p id="ov-msg" class="ov-msg" role="status"></p>
    <div id="ov-list" class="ov-list"></div>
  </div>
</div>
<script src="/static/wall_insights.js"></script>
<script src="/static/wall.js"></script>
<script src="/static/wall_review.js"></script>
</body>
</html>
