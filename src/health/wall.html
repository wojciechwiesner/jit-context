<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operator Wall - JIT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='3' width='18' height='18' rx='3' fill='none' stroke='%235eead4' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/mission.css">
<link rel="stylesheet" href="/static/wall.css">
</head>
<body>
<main class="wall" id="wall">
  <header class="verdict" id="verdict" aria-live="polite">
    <svg class="v-icon" viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><circle id="v-dot" cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.4"/><path id="v-mark" d="M8 12.5l2.7 2.7L16 9.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="v-text"><h1 id="v-sentence">Ładowanie...</h1><p id="v-now" class="v-now" hidden></p><p id="v-age" class="v-age"></p></div>
    <div class="v-refresh" title="Odświeżanie co 60 s"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span id="v-tick">60 s</span></div>
  </header>
  <section class="col needs" aria-labelledby="h-needs"><h2 id="h-needs">Wymaga mnie</h2><ul id="needs" class="rows"></ul></section>
  <section class="col projects" aria-labelledby="h-proj"><h2 id="h-proj">Projekty <small id="proj-count"></small></h2><div id="projects" class="tiles"></div></section>
  <section class="col machines" aria-labelledby="h-mach"><h2 id="h-mach">Maszyny i agenci</h2><div id="machines"></div><div id="sources" class="sources"></div></section>
  <footer class="charters" id="charters-bar">
    <span id="charters-text">Chartery: ...</span>
    <button type="button" id="charters-open" class="btn">Przejrzyj do zatwierdzenia</button>
  </footer>
</main>
<div id="overlay" class="overlay" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="ov-title">
    <div class="panel-bar"><h2 id="ov-title">Chartery do zatwierdzenia</h2><span class="sp"></span>
      <button type="button" id="ov-bulk" class="btn primary">Zatwierdź zaznaczone</button>
      <button type="button" id="ov-close" class="btn" aria-label="Zamknij"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button></div>
    <p id="ov-msg" class="ov-msg" role="status"></p>
    <div id="ov-list" class="ov-list"></div>
  </div>
</div>
<script src="/static/wall.js"></script>
<script src="/static/wall_review.js"></script>
</body>
</html>
