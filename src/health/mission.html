<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mission Control · JIT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='none' stroke='%235eead4' stroke-width='2'/%3E%3Ccircle cx='12' cy='12' r='3' fill='%235eead4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/mission.css">
</head>
<body>
<div class="mc">
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="#5eead4" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7.5" stroke-opacity=".45"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3" stroke-opacity=".7"/></svg>
      Mission Control <small>live · cockpit · history</small>
    </div>
    <label class="field">
      <span>projekt</span>
      <select id="project-select" aria-label="Projekt"></select>
    </label>
    <span id="live-pill" class="pill idle"><i></i>IDLE</span>
    <div class="sp"></div>
    <div id="error-banner" class="err" role="alert"></div>
    <span class="meta" id="refresh-meta">-</span>
    <button class="icon-btn" id="refresh-btn" title="Odśwież (R)" aria-label="Odśwież">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
    <button class="icon-btn" id="focus-btn" title="Tryb skupienia: tylko stream (F)" aria-label="Tryb skupienia">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <span class="user" id="user-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      <b id="user-name">-</b>
    </span>
  </header>

  <aside class="panel rail">
    <div class="panel-head">
      <h2>Sesje</h2>
      <div class="seg" role="tablist" aria-label="Zakres historii">
        <button data-hours="24">24h</button><button data-hours="168" class="on">7d</button><button data-hours="720">30d</button>
      </div>
    </div>
    <label class="scope"><input type="checkbox" id="all-sessions"> wszystkie projekty</label>
    <ol class="sessions" id="session-list"></ol>
  </aside>

  <section class="panel stream">
    <div class="panel-head">
      <h2>Live stream</h2>
      <span class="meta" id="stream-meta">-</span>
      <div class="sp"></div>
      <a class="link" id="stream-open" target="_blank" rel="noopener" title="Otwórz w nowej karcie">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>
      </a>
    </div>
    <iframe id="stream-frame" title="Live stream sesji" src="about:blank"></iframe>
  </section>

  <section class="panel project">
    <div class="panel-head">
      <nav class="tabs" role="tablist" aria-label="Widok projektu">
        <button data-tab="status" class="on">Status</button>
        <button data-tab="diagram">Diagram</button>
        <button data-tab="cockpit">Cockpit</button>
        <button data-tab="info">Info</button>
      </nav>
    </div>
    <div class="tab-body" id="tab-status"></div>
    <div class="tab-body" id="tab-diagram" hidden></div>
    <div class="tab-body flush" id="tab-cockpit" hidden></div>
    <div class="tab-body" id="tab-info" hidden></div>
  </section>
</div>
<script src="/static/mission_panels.js"></script>
<script src="/static/mission.js"></script>
</body>
</html>
