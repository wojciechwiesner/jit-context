name: Tests

on:
  push:
  pull_request:

jobs:
  core-and-agent-zero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core and test requirements
        run: python -m pip install -e '.[dev]'
      - name: Test core
        run: python -m pytest src/tests -q
      - name: Test Agent Zero adapter (isolated collection)
        run: python -m pytest integrations/agent-zero/tests -q
