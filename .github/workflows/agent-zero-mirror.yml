name: Agent Zero plugin mirror

# Mirrors integrations/agent-zero/ to the root of wojciechwiesner/jit-context-os
# (the Agent Zero Plugin Hub needs plugin.yaml at the repository root).
# Non-destructive: regular commits on top of the mirror's history, never a force-push.
# Requires secret JIT_CONTEXT_OS_DEPLOY_KEY: private half of a write-enabled
# deploy key registered on jit-context-os.

on:
  push:
    branches: [master]
    paths:
      - 'integrations/agent-zero/**'
      - '.github/workflows/agent-zero-mirror.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-zero-mirror
  cancel-in-progress: false

env:
  MIRROR_REPO: git@github.com:wojciechwiesner/jit-context-os.git
  MIRROR_BRANCH: master
  SOURCE_DIR: integrations/agent-zero

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH deploy key
        env:
          DEPLOY_KEY: ${{ secrets.JIT_CONTEXT_OS_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::secret JIT_CONTEXT_OS_DEPLOY_KEY is not set"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_mirror
          chmod 600 ~/.ssh/id_mirror
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/id_mirror -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

      - name: Clone mirror
        run: git clone --branch "$MIRROR_BRANCH" "$MIRROR_REPO" mirror

      - name: Sync plugin into mirror
        run: |
          test -f "$SOURCE_DIR/plugin.yaml" || { echo "::error::$SOURCE_DIR/plugin.yaml missing"; exit 1; }
          rsync -a --delete --exclude .git "$SOURCE_DIR/" mirror/

      - name: Commit and push if changed
        working-directory: mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898583+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Mirror already up to date."
            exit 0
          fi
          git diff --cached --stat
          short_sha="${GITHUB_SHA::7}"
          git commit \
            -m "chore(sync): mirror integrations/agent-zero from jit-context@${short_sha}" \
            -m "Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          git push origin "HEAD:${MIRROR_BRANCH}"
