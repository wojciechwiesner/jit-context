name: Agent Zero plugin release

# Tag a0-v<version> (matching integrations/agent-zero/plugin.yaml) to publish
# jit_context-<version>.zip, installable via Agent Zero > Plugins > Install from ZIP.

on:
  push:
    tags: ['a0-v*']

permissions:
  contents: write

jobs:
  release-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test the plugin
        run: |
          python -m pip install pytest
          python -m pytest integrations/agent-zero/tests -q
      - name: Build ZIP
        run: |
          version="${GITHUB_REF_NAME#a0-v}"
          grep -qx "version: ${version}" integrations/agent-zero/plugin.yaml \
            || { echo "::error::tag ${GITHUB_REF_NAME} does not match plugin.yaml version"; exit 1; }
          mkdir -p dist/jit_context
          rsync -a --exclude tests --exclude __pycache__ --exclude data integrations/agent-zero/ dist/jit_context/
          (cd dist && zip -qr "jit_context-${version}.zip" jit_context)
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/jit_context-${VERSION}.zip" \
            --title "Agent Zero plugin ${VERSION}" \
            --notes "Install in Agent Zero: Plugins > Install from ZIP (this file), or install from git: https://github.com/wojciechwiesner/jit-context-os. One line for every agent host: curl -fsSL https://raw.githubusercontent.com/wojciechwiesner/jit-context/master/install.sh | bash"
